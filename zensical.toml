[project]
site_name = "ESP32 GNSS field"
site_description = "ESP32 portable GNSS field node with ATGM336H and ST7789"
site_url = "https://esp32-gnss-field.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "Prerequisites" = "prerequisites.md" },
  { "Hardware" = "hardware.md" },
  { "Firmware" = "firmware.md" },
  { "Phase 0 — USB erase" = "phases/00-usb-erase.md" },
  { "Phase 1 — Hello flash" = "phases/01-hello-flash.md" },
  { "Phase 2 — TFT power" = "phases/02-tft-power.md" },
  { "Phase 3 — GNSS power" = "phases/03-gnss-power.md" },
  { "Phase 4 — NMEA raw" = "phases/04-nmea-raw.md" },
  { "Phase 5 — Fix parse" = "phases/05-fix-parse.md" },
  { "Phase 6 — TFT fill" = "phases/06-tft-fill.md" },
  { "Phase 7 — Field UI" = "phases/07-field-ui.md" },
  { "Lab log" = "lab-log.md" },
]

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed" = { alternate_style = true }
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
