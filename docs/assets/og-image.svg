<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ESP32 GNSS field — portable GNSS field node">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10302a"/>
      <stop offset="1" stop-color="#0a1f1b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle latitude/longitude grid -->
  <g stroke="#1f8a70" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- brand accent bar -->
  <rect x="80" y="110" width="70" height="8" rx="4" fill="#1f8a70"/>

  <!-- title -->
  <text x="80" y="210" font-family="DejaVu Sans, sans-serif" font-size="92" font-weight="700" fill="#ffffff">ESP32 GNSS field</text>

  <!-- tagline -->
  <text x="82" y="272" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#9fd9cb">A portable GNSS field node you wire yourself.</text>
  <text x="82" y="322" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#7fb8ab">Fix quality and position on a bright little TFT.</text>

  <!-- parts strip -->
  <g font-family="DejaVu Sans, sans-serif" font-size="26" fill="#cfe9e2">
    <rect x="82"  y="378" width="250" height="56" rx="28" fill="none" stroke="#1f8a70" stroke-width="2.5"/>
    <text x="207" y="414" text-anchor="middle">classic ESP32</text>
    <rect x="352" y="378" width="230" height="56" rx="28" fill="none" stroke="#1f8a70" stroke-width="2.5"/>
    <text x="467" y="414" text-anchor="middle">ATGM336H</text>
    <rect x="602" y="378" width="240" height="56" rx="28" fill="none" stroke="#1f8a70" stroke-width="2.5"/>
    <text x="722" y="414" text-anchor="middle">ST7789 TFT</text>
  </g>

  <!-- GNSS satellite -->
  <g transform="translate(985,470)">
    <!-- satellite -->
    <g transform="rotate(-18)">
      <!-- solar panels -->
      <g fill="none" stroke="#1f8a70" stroke-width="3.5">
        <rect x="-78" y="-14" width="46" height="28" rx="2"/>
        <line x1="-66.7" y1="-14" x2="-66.7" y2="14"/>
        <line x1="-55.3" y1="-14" x2="-55.3" y2="14"/>
        <line x1="-43.7" y1="-14" x2="-43.7" y2="14"/>
        <rect x="32" y="-14" width="46" height="28" rx="2"/>
        <line x1="43.7" y1="-14" x2="43.7" y2="14"/>
        <line x1="55.3" y1="-14" x2="55.3" y2="14"/>
        <line x1="66.7" y1="-14" x2="66.7" y2="14"/>
      </g>
      <line x1="-32" y1="0" x2="-20" y2="0" stroke="#1f8a70" stroke-width="3.5"/>
      <line x1="20" y1="0" x2="32" y2="0" stroke="#1f8a70" stroke-width="3.5"/>
      <!-- bus -->
      <rect x="-20" y="-18" width="40" height="36" rx="5" fill="#2fe3b8"/>
      <!-- dish -->
      <circle cx="0" cy="26" r="10" fill="none" stroke="#2fe3b8" stroke-width="4"/>
      <line x1="0" y1="18" x2="0" y2="8" stroke="#2fe3b8" stroke-width="3.5"/>
    </g>
  </g>

  <!-- footer domain -->
  <text x="80" y="560" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#5c8378">esp32-gnss-field.johna.kiwi</text>
</svg>
